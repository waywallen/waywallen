[workspace]
name = "waywallen"
members = [
  "bridge",
  "plugins",
  "plugins/org.waywallen.image",
  "plugins/org.waywallen.gltf",
  "plugins/org.waywallen.sketchfab",
  "plugins/org.waywallen.video",
  "plugins/org.waywallen.wallhaven",
  "tools/i18n",
  "tools/i18n/po",
  "ui",
  "ui/backend",
]
default-members = [
  "plugins/org.waywallen.image",
  "plugins/org.waywallen.gltf",
  "plugins/org.waywallen.sketchfab",
  "plugins/org.waywallen.video",
  "plugins/org.waywallen.wallhaven",
  "tools/i18n",
  "ui",
]

[workspace.package]
version = "0.5.0"

[workspace.dependencies]
waywallen-bridge = { path = "bridge" }
waywallen-plugin-common = { path = "plugins" }
waywallen-backend-connection = { path = "ui/backend" }
rstd-cppstd = { version = "0.1.7" }
rstd-std = { version = "0.1.7" }
rstd-json = { version = "0.1.7" }
rstd-argparse = { version = "0.1.7" }
rstd-log = { version = "0.1.7" }
rstd-toml = { version = "0.1.7" }
lito-qt = { version = "0.1.1" }
vvk = { version = "0.1.0" }
luato = { git = "https://github.com/litocpp/luato.git" }
wavsen = { git = "https://github.com/hypengw/wavsen.git" }
ncrequest = { git = "https://github.com/hypengw/ncrequest.git" }
qextra = { git = "https://github.com/hypengw/QExtra.git" }
vecgltf = { git = "https://github.com/vecren/vecgltf.git" }

[workspace.external-dependencies.pkg-config]
gbm = { module = "gbm" }
libavformat = { module = "libavformat", version = ">= 58" }
libavcodec = { module = "libavcodec", version = ">= 58" }
libavutil = { module = "libavutil", version = ">= 56" }
libswscale = { module = "libswscale", version = ">= 5" }

[workspace.external-sources.waywallen-control]
path = "proto"

[workspace.external-sources.waywallen-rust]
path = "."

[workspace.external-dependencies.cargo.waywallen-daemon]
source = "waywallen-rust"
package = "waywallen"

[workspace.external-sources.qml-material]
git = "https://github.com/hypengw/QmlMaterial.git"

[workspace.external-dependencies.cmake.qml-material]
package = "qml_material"
source = "qml-material"
adapter = "ui/cmake/QmlMaterial.cmake"
cache = { QML_MATERIAL_BUILD_TYPE = "STATIC", QM_BUILD_EXAMPLE = false, QM_BUILD_TESTS = false }

[workspace.external-dependencies.cmake.qt6]
package = "Qt6"
components = [
  "Core",
  "DBus",
  "LinguistTools",
  "Network",
  "Protobuf",
  "ProtobufQuick",
  "ProtobufWellKnownTypes",
  "Quick",
  "QuickPrivate",
  "WebSockets",
]
host-tools = [
  { name = "lrelease", target = "Qt6::lrelease" },
  { name = "moc", target = "Qt6::moc" },
  { name = "protoc", target = "WrapProtoc::WrapProtoc" },
  { name = "qmlcachegen", target = "Qt6::qmlcachegen" },
  { name = "qmlimportscanner", target = "Qt6::qmlimportscanner" },
  { name = "qmltyperegistrar", target = "Qt6::qmltyperegistrar" },
  { name = "qtprotobufgen", target = "Qt6::qtprotobufgen" },
  { name = "rcc", target = "Qt6::rcc" },
]
