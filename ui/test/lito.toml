[package]
name = "waywallen-ui-tests"
version.workspace = true
standard = "c++23"

[[test]]
name = "wallpaper-grid-model"
sources = ["grid_model.cpp"]

[usage]
private-include-directories = [{ path = ".", external-source = "ui-headers" }]

[external-sources.ui-headers]
path = "../include"

[dependencies.qextra]
workspace = true

[external-dependencies.cmake.qml-material]
workspace = true
targets = [{ name = "qml_material::waywallen" }]

[external-dependencies.cmake.qt6]
workspace = true
targets = [{ name = "Qt6::Core" }, { name = "Qt6::Quick" }]
