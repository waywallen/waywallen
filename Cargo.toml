[workspace]
members = [".", "tools/wayproto-gen"]
default-members = ["."]

[package]
name = "waywallen"
version = "0.5.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
wayproto-gen = { path = "tools/wayproto-gen" }
prost-build = "0.13"
cc = "1"
pkg-config = "0.3"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.13"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
ashpd = { version = "0.9.2", default-features = false, features = ["tokio"] }
thiserror = "2"
log = "0.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt", "registry", "tracing-log"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "stream"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }
nix = { version = "0.29", features = ["fs", "ioctl", "socket", "uio"] }
libc = "0.2"
# waywallen-renderer subprocess: ash for raw Vulkan control over
# DMA-BUF export + semaphore sync_fd export.
ash = "0.38"
toml = "0.8"
glob = "0.3"
zip = { version = "2", default-features = false, features = ["deflate", "zstd"] }
base64 = "0.22"
tempfile = "3"
qrcode = "0.14"
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "async", "serialize"] }
mlua-extra = { git = "https://github.com/hypengw/mlua-extra", rev = "00dab6caf0cce4bce9610e99c85d9017fae4e452", default-features = false, features = ["native-tls"] }
libloading = "0.8"
zbus = { version = "4", default-features = false, features = ["tokio"] }
sea-orm = { version = "1.1", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
sea-orm-migration = { version = "1.1", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }

[[bin]]
name = "waywallen"
path = "src/main.rs"

[[bin]]
name = "waywallen_display_demo"
path = "src/bin/waywallen_display_demo.rs"
test = false

[[bin]]
name = "waywallen_renderer"
path = "src/bin/waywallen_renderer.rs"
test = false
