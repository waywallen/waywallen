[package]
name = "waywallen-video-plugin"
version.workspace = true

[[bin]]
name = "waywallen-video-renderer"
module = "waywallen.video.entry"
sources = [
  "src/main.cpp",
  "src/entry.cppm",
  "src/entry.cpp",
]

[usage]
threads = true

[[test]]
name = "frame-rate-limit"
module = "waywallen.video.tests"
sources = ["tests/frame_rate_limit.cpp"]

[dependencies.waywallen-plugin-common]
workspace = true

[dependencies.wavsen]
workspace = true

[dependencies.rstd-cppstd]
workspace = true

[dependencies.rstd-json]
workspace = true

[dependencies.rstd-argparse]
workspace = true

[dependencies.rstd-log]
workspace = true

[runtime-dependencies.waywallen-bridge]
workspace = true
