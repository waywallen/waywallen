# waywallen-video — the canonical video renderer + Lua entry for waywallen.
#
# Pipeline: best-effort Vulkan hwdevice (FFmpeg AV_HWDEVICE_TYPE_VULKAN)
# decode → sw landing frame → swscale to NV12 → GPU NV12→RGBA compute
# pass into the bridge slot. PTS-driven pacing. render_node pins the
# Vulkan physical device used for the compute pass.

[plugin]
id = "org.waywallen.video"
name = "Video"
version = "0.6.0"
entry = "main.lua"
entry_version = 4

[plugin.i18n]
directory = "i18n"

[renderers.waywallen-video]
bin = "../../../../bin/waywallen-video-renderer"
types = ["video"]
type_labels = { video = { msgid = "Video" } }
priority = 100
activity = "continuous"
spawn_version = 10

[renderers.waywallen-video.settings]
loop_file = { type = "string", default = "inf", choices = ["inf", "no"], identity = false, label = { msgid = "Loop playback" }, group = "playback", group_label = { msgid = "Playback" }, order = 10 }
hwdec = { type = "string", default = "auto", choices = ["auto", "vaapi", "vulkan", "none"], identity = false, label = { msgid = "Hardware decoding" }, group = "decode", group_label = { msgid = "Decoding" }, order = 20 }
render_node = { type = "string", default = "", identity = true, label = { msgid = "Render node" }, group = "decode", group_label = { msgid = "Decoding" }, order = 30 }
volume = { type = "u32", default = 100, min = 0, max = 100, step = 1, identity = false, label = { msgid = "Volume" }, group = "audio", group_label = { msgid = "Audio" }, order = 40 }
enable_audio = { type = "bool", default = true, identity = false, label = { msgid = "Enable audio" }, group = "audio", group_label = { msgid = "Audio" }, order = 35 }
fps = { type = "u32", default = 30, min = 1, max = 240, step = 1, identity = true, label = { msgid = "Frame rate" }, group = "render", group_label = { msgid = "Rendering" }, order = 50 }
# -2 = auto, -1 = custom, 0 = origin, 1–4 = 720/1080/1440/2160p; never upscales.
resolution = { type = "i32", default = -2, choices = ["-2", "-1", "0", "1", "2", "3", "4"], identity = true, label = { msgid = "Resolution" }, group = "render", group_label = { msgid = "Rendering" }, order = 55 }
custom_extent = { type = "u32", default = 1080, min = 1, max = 8192, step = 1, identity = true, label = { msgid = "Custom resolution" }, group = "render", group_label = { msgid = "Rendering" }, order = 56 }
