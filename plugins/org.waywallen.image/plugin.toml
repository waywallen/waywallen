# waywallen-image — the canonical image renderer + Lua entry for waywallen.

[plugin]
id = "org.waywallen.image"
name = "Image"
version = "0.6.0"
entry = "main.lua"
entry_version = 4

[plugin.i18n]
directory = "i18n"

[renderers.waywallen-image]
bin = "../../../../bin/waywallen-image-renderer"
types = ["image"]
type_labels = { image = { msgid = "Image" } }
priority = 100
activity = "on_demand"
spawn_version = 10

[renderers.waywallen-image.settings]
fps = { type = "u32", default = 30, min = 1, max = 240, step = 1, identity = true, label = { msgid = "Frame rate" }, group = "render", group_label = { msgid = "Rendering" }, order = 10 }
# -2 = auto, -1 = custom, 0 = origin, 1–4 = 720/1080/1440/2160p; never upscales.
resolution = { type = "i32", default = -2, choices = ["-2", "-1", "0", "1", "2", "3", "4"], identity = true, label = { msgid = "Resolution" }, group = "render", group_label = { msgid = "Rendering" }, order = 15 }
custom_extent = { type = "u32", default = 1080, min = 1, max = 8192, step = 1, identity = true, label = { msgid = "Custom resolution" }, group = "render", group_label = { msgid = "Rendering" }, order = 16 }
render_node = { type = "string", default = "", identity = true, label = { msgid = "Render node" }, group = "render", group_label = { msgid = "Rendering" }, order = 20 }
