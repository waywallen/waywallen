[package]
name = "waywallen-image-plugin"
version.workspace = true

[[bin]]
name = "waywallen-image-renderer"
module = "waywallen.image.entry"
sources = [
  "src/main.cpp",
  "src/entry.cppm",
  "src/entry.cpp",
  "src/av_image.cppm",
  "src/av_image.cpp",
  "src/image_content.cppm",
  "src/image_content.cpp",
]

[usage]
threads = true

[[test]]
name = "image-content"
module = "waywallen.image.tests"
sources = ["tests/main.cppm", "tests/image_content.cpp", "src/image_content.cppm", "src/image_content.cpp", "src/av_image.cppm", "src/av_image.cpp"]

[dev-dependencies.rstd-test]
version = "0.1.9"

[dependencies.waywallen-plugin-common]
workspace = true

[dependencies.wavsen]
workspace = true

[dependencies.rstd-std]
workspace = true

[dependencies.rstd-json]
workspace = true

[dependencies.rstd-argparse]
workspace = true

[dependencies.rstd-log]
workspace = true

[runtime-dependencies.waywallen-bridge]
workspace = true
