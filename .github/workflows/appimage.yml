name: Build AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            miniconda_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            miniconda_arch: aarch64
    env:
      DEBIAN_FRONTEND: noninteractive
      WAYWALLEN_CONDA_ENV: waywallen
    steps:
      - name: Install OS prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates git bzip2 file xz-utils \
            build-essential pkg-config glslang-tools \
            libfuse2 libxkbcommon0 libgl1 libegl1 libpulse-dev \
            libglib2.0-0 libgles-dev libgbm-dev libfreetype-dev libxml2-dev \
            libpipewire-0.3-dev libarchive-tools zsync

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Miniconda
        run: |
          curl -fsSL -o /tmp/miniconda.sh \
            https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-${{ matrix.miniconda_arch }}.sh
          bash /tmp/miniconda.sh -b -p "$HOME/miniconda"
          echo "$HOME/miniconda/bin" >> "$GITHUB_PATH"
          echo "$HOME/miniconda/condabin" >> "$GITHUB_PATH"

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: build/conda-envs/waywallen
          key: conda-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('environment.yml', 'scripts/build_appimage.sh', 'scripts/build_ffmpeg.sh', 'scripts/copy_syslibs.sh') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/release/dependencies/cargo
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'lito.lock') }}

      - name: Build AppImage
        run: bash ./scripts/build_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: waywallen-appimage-${{ matrix.arch }}
          path: waywallen-*-${{ matrix.arch }}.AppImage*

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: appimage
    if: github.event_name == 'push' || startsWith(inputs.tag || '', 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: waywallen-appimage-*
          path: release-artifacts
          merge-multiple: true

      - name: Determine release
        id: rel
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: release-notes
        uses: hypengw/appstream-release-notes-action@v0.1.0
        with:
          file: ui/assets/waywallen-ui.releases.xml
          version: ${{ steps.rel.outputs.tag }}

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          artifacts: release-artifacts/*.AppImage*
          bodyFile: ${{ steps.release-notes.outputs.path }}
          immutableCreate: true
          skipIfReleaseExists: true
