# waywallen build environment (conda-forge only).
name: waywallen
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Qt6 >= 6.10 (UI uses Quick / DBus / Protobuf)
  - qt6-main>=6.10
  - qt6-wayland>=6.10
  - freetype
  - expat
  - libxml2-devel

  # Used to build qtgrpc from source (conda-forge has no Qt6 Protobuf package)
  - libprotobuf
  - protobuf

  # Toolchain: clang / clang++ / lld all 22.x (BUILD.md requires >=22)
  # clang-tools provides clang-scan-deps (required by C++20 module compilation)
  # Portable packaging also needs native activation wrappers, a compatible
  # glibc sysroot, and Mesa GBM development files for the host architecture.
  - clang=22
  - clangxx=22
  - clang-tools=22
  - lld=22
  - llvm-tools=22

  - libvulkan-headers
  - libvulkan-loader
  - libgles-devel
  - lz4-c
  - libva-utils
  - dav1d-dev

  # FFmpeg
  - nasm
  - make
  - zlib
  - libjxl

  # Build infrastructure
  - cmake>=3.28
  - ninja
  - pkg-config
